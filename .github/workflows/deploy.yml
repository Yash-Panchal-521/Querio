name: Deploy

on:
  push:
    branches: [main]
  # Re-running a deploy by hand is the fastest recovery when a provider fails mid-rollout.
  workflow_dispatch:

# Deploys queue rather than cancel. Cancelling one halfway can leave a migration applied
# with no code deployed against it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        # The SDK finds global.json by walking up from the working directory, and ours sits
        # in backend/. Same reason the CI jobs run from here.
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Install EF tooling
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Check the connection string is usable
        # Every check here exists because the failure it prevents is unreadable. Without them
        # you get a null-reference from inside EF, an ArgumentException naming half a URI, or
        # `prepared statement "s0" already exists` — none of which say what to change.
        #
        # The secret arrives through env rather than ${{ }} interpolation so that a value
        # containing quotes cannot terminate the script and run as shell.
        env:
          CONNECTION_STRING: ${{ secrets.QUERIO_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$CONNECTION_STRING" ]; then
            echo "::error::QUERIO_MIGRATION_CONNECTION_STRING is not set on the production environment."
            exit 1
          fi

          case "$CONNECTION_STRING" in
            postgres://*|postgresql://*)
              echo "::error::QUERIO_MIGRATION_CONNECTION_STRING is a URI. Npgsql does not parse those — it needs ADO.NET keyword syntax, e.g. Host=HOST;Port=5432;Database=querio;Username=USER;Password=PASS;SSL Mode=Require"
              exit 1
              ;;
          esac

          case "$CONNECTION_STRING" in
            *-pooler.*)
              echo "::error::QUERIO_MIGRATION_CONNECTION_STRING points at Neon's pooled endpoint. Migrations need the direct one — drop '-pooler' from the host. The application keeps using the pooled endpoint."
              exit 1
              ;;
          esac

      - name: Restore
        # `dotnet ef database update` builds the project first, and building without a
        # restore fails with NETSDK1004 about a missing assets file — which reads as a
        # project problem rather than a missing step.
        run: dotnet restore src/Querio.Infrastructure/Querio.Infrastructure.csproj

      - name: Apply migrations
        # Migrations run before the new code is deployed, and the readiness probe reports an
        # instance unready while its schema is behind — so the two together mean traffic
        # never reaches a process whose schema does not match it.
        #
        # The consequence to respect: during this window the OLD code is running against the
        # NEW schema, so every migration must be backward-compatible with the release it is
        # replacing. Add columns before writing to them; drop them a release later.
        env:
          # Neon's DIRECT endpoint, not the pooled one. Migrations over PgBouncer fail with
          # `prepared statement "s0" already exists`, and a SET search_path does not survive
          # past its own transaction. The application itself uses the pooled endpoint; only
          # this step needs the direct one.
          QUERIO_CONNECTION_STRING: ${{ secrets.QUERIO_MIGRATION_CONNECTION_STRING }}
        run: |
          dotnet ef database update \
            --project src/Querio.Infrastructure \
            --startup-project src/Querio.Infrastructure

  api:
    name: Deploy API
    needs: migrate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Render and wait for it to go live
        # A deploy hook rather than Render's own GitHub auto-deploy, so this happens after
        # migrations rather than racing them. Render's Auto-Deploy is Off for the same reason.
        #
        # The hook alone is fire-and-forget: it returns the moment Render ACCEPTS the request,
        # which would make this job green while the build fails, the image crashes on boot, or
        # the instance never passes its health check. So the job polls until the deploy reaches
        # a terminal state.
        #
        # Reaching `live` is a real assertion, not just "the build compiled": Render only marks
        # a deploy live once its health check path — /health/ready — returns success, and that
        # check includes the pending-migrations check.
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set on the production environment."
            exit 1
          fi

          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set on the production environment. Create one at Render → Account Settings → API Keys. Without it this job can only fire the hook and never learn whether the deploy actually succeeded."
            exit 1
          fi

          # The service id is already inside the hook URL: .../deploy/srv-XXXX?key=YYYY
          SERVICE_ID=$(printf '%s' "$DEPLOY_HOOK_URL" | grep -oE 'srv-[a-zA-Z0-9]+' | head -1 || true)
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Could not read a service id (srv-...) out of RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi

          render_api() {
            curl --fail --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" "$@"
          }

          latest_deploy_id() {
            render_api "https://api.render.com/v1/services/$SERVICE_ID/deploys?limit=1"               | jq -r '.[0].deploy.id // .[0].id // empty'
          }

          # Record the newest deploy BEFORE triggering. Without this the poll below can read
          # the PREVIOUS deploy — still `live` from the last release — and call the new one a
          # success before Render has even created it.
          PREVIOUS_DEPLOY_ID=$(latest_deploy_id || true)
          echo "Previous deploy: ${PREVIOUS_DEPLOY_ID:-none}"

          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy hook accepted; waiting for Render to create the deploy."

          DEPLOY_ID=""
          for _ in $(seq 1 30); do
            CANDIDATE=$(latest_deploy_id || true)
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$PREVIOUS_DEPLOY_ID" ]; then
              DEPLOY_ID="$CANDIDATE"
              break
            fi
            sleep 5
          done

          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render accepted the hook but never created a new deploy."
            exit 1
          fi

          echo "Watching deploy $DEPLOY_ID"
          DEPLOY_URL="https://dashboard.render.com/web/$SERVICE_ID/deploys/$DEPLOY_ID"

          # 40 minutes at 15s. A Render build slower than that has gone wrong in a way worth
          # failing loudly rather than waiting out.
          for _ in $(seq 1 160); do
            STATUS=$(render_api "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID"               | jq -r '.status // .deploy.status // empty' || true)

            case "$STATUS" in
              live)
                echo "Deploy is live — Render's health check on /health/ready passed."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy finished as '$STATUS'. Logs: $DEPLOY_URL"
                exit 1
                ;;
              "")
                echo "  (no status yet, retrying)"
                ;;
              *)
                echo "  $STATUS"
                ;;
            esac

            sleep 15
          done

          echo "::error::Timed out after 40 minutes waiting on deploy $DEPLOY_ID. Logs: $DEPLOY_URL"
          exit 1
