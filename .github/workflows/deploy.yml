name: Deploy

on:
  push:
    branches: [main]
  # Re-running a deploy by hand is the fastest recovery when a provider fails mid-rollout.
  workflow_dispatch:

# Deploys queue rather than cancel. Cancelling one halfway can leave a migration applied
# with no code deployed against it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        # The SDK finds global.json by walking up from the working directory, and ours sits
        # in backend/. Same reason the CI jobs run from here.
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Install EF tooling
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Check the connection string is usable
        # Every check here exists because the failure it prevents is unreadable. Without them
        # you get a null-reference from inside EF, an ArgumentException naming half a URI, or
        # `prepared statement "s0" already exists` — none of which say what to change.
        #
        # The secret arrives through env rather than ${{ }} interpolation so that a value
        # containing quotes cannot terminate the script and run as shell.
        env:
          CONNECTION_STRING: ${{ secrets.QUERIO_MIGRATION_CONNECTION_STRING }}
        run: |
          if [ -z "$CONNECTION_STRING" ]; then
            echo "::error::QUERIO_MIGRATION_CONNECTION_STRING is not set on the production environment."
            exit 1
          fi

          case "$CONNECTION_STRING" in
            postgres://*|postgresql://*)
              echo "::error::QUERIO_MIGRATION_CONNECTION_STRING is a URI. Npgsql does not parse those — it needs ADO.NET keyword syntax, e.g. Host=HOST;Port=5432;Database=querio;Username=USER;Password=PASS;SSL Mode=Require"
              exit 1
              ;;
          esac

          case "$CONNECTION_STRING" in
            *-pooler.*)
              echo "::error::QUERIO_MIGRATION_CONNECTION_STRING points at Neon's pooled endpoint. Migrations need the direct one — drop '-pooler' from the host. The application keeps using the pooled endpoint."
              exit 1
              ;;
          esac

      - name: Restore
        # `dotnet ef database update` builds the project first, and building without a
        # restore fails with NETSDK1004 about a missing assets file — which reads as a
        # project problem rather than a missing step.
        run: dotnet restore src/Querio.Infrastructure/Querio.Infrastructure.csproj

      - name: Apply migrations
        # Migrations run before the new code is deployed, and the readiness probe reports an
        # instance unready while its schema is behind — so the two together mean traffic
        # never reaches a process whose schema does not match it.
        #
        # The consequence to respect: during this window the OLD code is running against the
        # NEW schema, so every migration must be backward-compatible with the release it is
        # replacing. Add columns before writing to them; drop them a release later.
        env:
          # Neon's DIRECT endpoint, not the pooled one. Migrations over PgBouncer fail with
          # `prepared statement "s0" already exists`, and a SET search_path does not survive
          # past its own transaction. The application itself uses the pooled endpoint; only
          # this step needs the direct one.
          QUERIO_CONNECTION_STRING: ${{ secrets.QUERIO_MIGRATION_CONNECTION_STRING }}
        run: |
          dotnet ef database update \
            --project src/Querio.Infrastructure \
            --startup-project src/Querio.Infrastructure

  api:
    name: Deploy API
    needs: migrate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger the Render deploy
        # A deploy hook rather than Render's own GitHub auto-deploy, purely so it happens
        # after migrations rather than racing them. Render's Auto-Deploy is set to Off for
        # the same reason.
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set on the production environment."
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"

      - name: Note
        run: |
          echo "Render is now building. The instance stays out of the load balancer until"
          echo "/health/ready passes, which includes the schema check."
